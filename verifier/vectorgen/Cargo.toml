[package]
name = "memaster-vectorgen"
version = "0.1.0"
edition = "2021"
description = "Génère les vecteurs de test du vérificateur Python depuis le contrat Memaster (code Rust et sandbox)"
license = "UNLICENSED"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
memaster = { path = "../../contract" }
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
near-workspaces = { version = "0.24.0" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"

# Crate autonome : ne rejoint pas le workspace du contrat.
[workspace]

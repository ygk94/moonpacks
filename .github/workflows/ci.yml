# CI Moonpacks : tests de chaque partie du dépôt à chaque push et pull request, puis mise en ligne du site sur
# Vercel depuis `main` (ou à la demande). Aucun secret n'est nécessaire pour les tests ; le fichier secret des
# mythiques n'est jamais dans la CI (le contrôle anti-fuite s'y limite à la structure).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Mettre le site en ligne sur Vercel après les tests"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  front:
    name: Front (tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      # Python : prepare-assets génère les visuels avec art/.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      # Build de production : types, visuels, absence du wallet de test, contrôle anti-fuite des mythiques.
      - run: npm run build

  python:
    name: Python (art, vérificateur, simulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sim/requirements.txt
      - name: Art
        working-directory: art
        run: python -m unittest discover -s tests
      - name: Vérificateur
        working-directory: verifier
        run: python -m unittest discover -s tests -t .
      - name: Simulation
        working-directory: sim
        run: |
          pip install -r requirements.txt
          python -m pytest -q tests

  contract:
    name: Contrat (tests unitaires)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Les tests sandbox (near-workspaces, ~90 s, binaire near-sandbox téléchargé) restent à lancer à la main.
      - name: cargo test --lib
        working-directory: contract
        run: cargo test --lib

  deploy:
    name: Mise en ligne (Vercel)
    needs: [front, python, contract]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: front
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Secrets Vercel présents
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!v}" ] || { echo "::error::secret $v manquant (Settings > Secrets and variables > Actions)"; exit 1; }
          done
      - run: npm ci
      - run: npm run deploy

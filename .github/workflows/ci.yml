# Moonpacks CI: tests every part of the repository on each push and pull request, then deploys the site to
# Vercel from `main` (or on demand). No secret is needed for the tests; the mythic secrets file is never available
# in CI (the leak check there is limited to structure).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the site to Vercel after the tests"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  front:
    name: Front (tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      # Python: prepare-assets generates the card visuals with art/.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      # Production build: types, visuals, no test wallet, mythic leak check.
      - run: npm run build

  python:
    name: Python (art, verifier, simulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sim/requirements.txt
      - name: Art
        working-directory: art
        run: python -m unittest discover -s tests
      - name: Verifier
        working-directory: verifier
        run: python -m unittest discover -s tests -t .
      - name: Simulation
        working-directory: sim
        run: |
          pip install -r requirements.txt
          python -m pytest -q tests

  contract:
    name: Contract (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Sandbox tests (near-workspaces, ~90 s, downloads the near-sandbox binary) are run manually.
      - name: cargo test --lib
        working-directory: contract
        run: cargo test --lib

  deploy:
    name: Deploy (Vercel)
    needs: [front, python, contract]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: front
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Contract read by the site: repository variable (Settings > Variables); empty means the default in front/src/config.ts.
      VITE_CONTRACT_ID: ${{ vars.CONTRACT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check Vercel secrets
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!v}" ] || { echo "::error::secret $v missing (Settings > Secrets and variables > Actions)"; exit 1; }
          done
      - run: npm ci
      - run: npm run deploy

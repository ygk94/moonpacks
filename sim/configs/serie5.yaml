# Série 5 : décisions du porteur appliquées par le contrat (pitié sans garantie, mythique ~1 pour 10⁶ packs classiques,
# gold pack 99/1, V moyenne 75 % pour normal et rush). Lu par `python -m memaster_sim.serie5`. Copie de
# serie4-valeur.yaml, seuls les paramètres marqués « série 5 » changent. Valeurs V en multiples du prix (1 = 10 000 bps).

near_usd: 2.5                 # cours du NEAR (paramètre)
prix_usd: [0.20, 0.50]

couts:
  gaz_tgas: 48                # série 5 : pas de meilleure mesure que la série 4, on garde 48 Tgas
  near_par_tgas: 0.0001
  gaz_paye_par: equipe        # cas prudent (relais) ; sur NEAR, c'est normalement l'acheteur
  octets_par_pack: 971        # série 5 : mesure du contrat
  near_par_octet: 0.00001
  stockage_paye_par: acheteur
  frais_achat: [0.005, 0.0075, 0.01]   # achat groupé des jetons, part de la valeur achetée
  delta: 0.05                 # part du prix versée à la réserve (prise sur la marge)
  epsilon: 0.15               # borne anti-arbitrage : gain « brûle tout » ≤ (1 − ε) × prix
  seuil_brulable_near: 0.02   # 0,05 $ : en dessous, une carte brûlable ne vaut pas le geste

catalogue:
  brulables_communes: 20      # parmi les 91 communes vivantes

# série 5 : mythique jamais brûlable, multiplicateur 0 (exigé par le contrat : une mythique garde l'adossement de son contenu)
multiplicateurs: {commune: 1, rare: 2, epique: 3, legendaire: 6, mythique: 0}

# série 5 : poids de rareté du contrat (total 2·10⁷) mythique 5, légendaire 40 000, épique 360 000, rare 1 600 000,
# commune 17 999 995. La sim garde ses tables d'emplacement de la série 3 pour les autres raretés et aligne la mythique :
# 5 / 2·10⁷ par emplacement (la commune compense) ; le 5e emplacement (tiré parmi les brûlables) retombe sur la légendaire.
raretes_contrat:
  poids: {mythique: 5, legendaire: 40000, epique: 360000, rare: 1600000, commune: 17999995}

# série 5 : pas de garantie ; chance min(p_max, p0 + k·n), plafond atteint en 1 000 packs ; remise à 0 après un gold seulement
pitie: {p0: 0.00002, k: 2.0e-8, p_max: 0.00004, N: null}
population: {joueurs: 100000, mediane: 4, sigma: 1.4, maximum: 5000}

rush:
  part: 0.05                  # part des packs non gold vendus en rush
  facteurs: {rare: 1.17, epique: 1.34, legendaire: 1.51, mythique: 1.0}   # série 5 : mythique × 1
  couverture_max: 0.80

gold_pack:
  minimums: [rare, rare, epique, epique]
  dernier: {legendaire: 0.99, mythique: 0.01}   # série 5
  brulable: 1                 # série 5 : le 2e emplacement est tiré parmi les brûlables (comme le contrat), pas le 5e

tables:
  normal: {paliers: [[2000, 10000, 500], [11000, 20000, 1000]], sigma: 0.6, cible: 0.75}
  gold:   {paliers: [[10000, 20000, 1000], [22500, 25000, 2500], [30000, 50000, 5000]], sigma: 0.4, cible: 2.0}
  rush:   {paliers: [[2000, 10000, 500], [11000, 20000, 1000]], sigma: 0.6, cible: 0.75}   # série 5 : 75 %
  total_poids: 1000000

variantes:
  a: {sur: moyenne}
recommandee: a

mythique:
  hors_v_x_prix: 55.2
  grille_jackpot_x_prix: [5, 10, 55.2]
  grille_part_mythique_gold: [0.01]
  stock_par_mythique: 10
  stock_par_legendaire: 50

# série 5 : contrôles Monte-Carlo de la fréquence de gold
monte_carlo:
  cycles: 1000000             # cycles tirés pack par pack jusqu'au plafond, puis queue géométrique
  flux: {joueurs: 100000, packs: 3000}   # 3·10⁸ packs-joueurs, compteurs initiaux stationnaires
